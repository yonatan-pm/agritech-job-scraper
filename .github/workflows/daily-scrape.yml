name: Daily job scrape

on:
  schedule:
    # 09:00 Israel time ≈ 06:00 UTC (winter); adjust if needed
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scraper once
        run: npm run once
        env:
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          JOBS_SOURCES: ${{ vars.JOBS_SOURCES }}
          JOBS_URL: ${{ vars.JOBS_URL }}
          AGRI_GOV_URL: ${{ vars.AGRI_GOV_URL }}
          WEIZMANN_URL: ${{ vars.WEIZMANN_URL }}
          HUJI_URL: ${{ vars.HUJI_URL }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}

      - name: Persist seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-jobs.json
          if git diff --staged --quiet; then
            echo "No seen-jobs changes to commit."
          else
            git commit -m "chore: update seen-jobs after scrape"
            git push
          fi
